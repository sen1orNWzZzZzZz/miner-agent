[project]
name = "agent-client"
version = "0.1.0"
description = "LangGraph Agent client orchestrating Miner MCP servers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-mcp-adapters>=0.1.0",
    "tiktoken>=0.7",
    "shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_client"]

[tool.hatch.metadata]
allow-direct-references = true

[project.scripts]
miner-agent = "agent_client.main:main"
