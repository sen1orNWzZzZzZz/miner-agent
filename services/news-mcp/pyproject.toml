[project]
name = "news-mcp"
version = "0.1.0"
description = "Mining news aggregation MCP server"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.6.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "uvicorn>=0.30",
    "shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/news_mcp"]

[tool.hatch.metadata]
allow-direct-references = true
