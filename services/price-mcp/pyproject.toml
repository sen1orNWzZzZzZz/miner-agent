[project]
name = "price-mcp"
version = "0.1.0"
description = "LME / commodity price MCP server"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.6.0",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/price_mcp"]

[tool.hatch.metadata]
allow-direct-references = true
